name: CD

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [frontend, backend, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      # Portainer webhook triggers a stack re-pull and redeploy of all services
      # whose image tag has changed. No SSH access required on the Droplet.
      #
      # Required GitHub secret:
      #   PORTAINER_WEBHOOK_URL — copied from Portainer UI:
      #     Stacks → procurement → Webhooks → copy URL
      #
      # The webhook performs the equivalent of:
      #   docker stack deploy -c docker-stack.yml procurement
      # using the image tags already pushed to ghcr.io in the previous job.
      - name: Trigger Portainer stack redeploy
        run: |
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 30 \
            -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")

          echo "Portainer webhook responded with HTTP ${HTTP_STATUS}"

          if [[ "${HTTP_STATUS}" != "200" && "${HTTP_STATUS}" != "204" ]]; then
            echo "ERROR: Portainer webhook returned unexpected status ${HTTP_STATUS}"
            exit 1
          fi

          echo "Stack redeploy triggered successfully."
